<!DOCTYPE html>
<html lang="en">

    <!-- PWA Primary Color & Meta -->
    <meta name="theme-color" content="#4ECDC4">
    <meta name="description" content="Spelling Bee practice app designed specifically for 4-year-old Kinder students. Flashcard reading + Letter-by-letter spelling in English.">

    <!-- Custom Typography & CSS Animations -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');
        
        * {
            font-family: 'Fredoka', 'Comic Sans MS', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            background: linear-gradient(135deg, #E0F7FA 0%, #FFF9C4 50%, #FCE4EC 100%);
        }

        .bubble-btn {
            transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 6px 0 rgba(0,0,0,0.15);
        }

        .bubble-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.15);
        }

        .pop-in {
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .shake {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            border: 4px solid rgba(255, 255, 255, 0.7);
        }

        /* Hide scrollbars */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
                </svg>

        /* ----------------------------------------------------
           2. STATE VARIABLES
           ---------------------------------------------------- */
        let activeWordList = [...WORDS_DATA];
        let currentIndex = 0;
        let userInputs = [];
        let score = 0;
        let hintModeActive = true;
        let audioCtx = null;
        let recognition = null;
        let isListening = false;
        let completed = new Set();
        let currentFilter = 'all';

        const SAVE_KEY = 'kinderBeeProgress.v1';
        function saveProgress() {
            try {
                const item = activeWordList[currentIndex];
                localStorage.setItem(SAVE_KEY, JSON.stringify({
                    wordId: item ? item.id : 1, score, hint: hintModeActive,
                    filter: currentFilter, completed: [...completed]
                }));
            } catch(e) {}
        }
        function restoreProgress() {
            try {
                const d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
                if (!d) return;
                score = d.score || 0;
                hintModeActive = d.hint !== false;
                completed = new Set(d.completed || []);
                currentFilter = d.filter || 'all';
                applyFilter(currentFilter);
                const idx = activeWordList.findIndex(w => w.id === d.wordId);
                currentIndex = idx >= 0 ? idx : 0;
                document.getElementById('star-count').textContent = score;
                document.getElementById('hint-btn-label').textContent = hintModeActive ? 'Guide: ON' : 'Guide: OFF';

        /* ----------------------------------------------------
           4. WEB SPEECH RECOGNITION SYSTEM (Dictation Engine - Mobile & Universal Fix)
           ---------------------------------------------------- */
        function initAudioEngine() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function speakText(text, pitch = 1.1) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.85;
                utterance.pitch = pitch;
                window.speechSynthesis.speak(utterance);
            }
        }

        function speakLetter(letter) {
            speakText(letter, 1.2);
        }

        function speakCurrentWord() {
            const currentItem = activeWordList[currentIndex];
            if (currentItem) {
                speakText(currentItem.word);
            }
        }

        function playSound(type) {
            initAudioEngine();
            if (!audioCtx) return;

            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'pop') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.08);
                } else if (type === 'error') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(150, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.2);
                }
            } catch(e) {}
        }

        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const statusElem = document.getElementById('voice-status');

            if (!SpeechRecognition) {
                statusElem.textContent = "⚠️ Speech Recognition is not supported on this browser/environment. Please use the letter buttons below.";
                statusElem.classList.remove('animate-pulse');
                statusElem.classList.add('text-rose-600');
                document.getElementById('mic-btn').disabled = true;
                return null;
            }

            // Check if context is insecure (Web Speech API requires HTTPS or localhost)
            if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
                statusElem.textContent = "⚠️ Microphone requires HTTPS. If testing preview, open app in secure view.";
            }

            const rec = new SpeechRecognition();
            rec.continuous = true;
            rec.interimResults = true;
            rec.lang = 'en-US';
            rec.maxAlternatives = 5;
            // Prefer on-device recognition (works offline when the English language pack is installed)
            if ('processLocally' in rec) { try { rec.processLocally = true; } catch(e) {} }
            try {
                const G = window.SpeechGrammarList || window.webkitSpeechGrammarList;
                if (G) {
                    const g = new G();
                    g.addFromString('#JSGF V1.0; grammar letters; public <l> = a | b | c | d | e | f | g | h | i | j | k | l | m | n | o | p | q | r | s | t | u | v | w | x | y | z ;', 1);
                    rec.grammars = g;
                }
            } catch(e) {}

            rec.onstart = function() {
                isListening = true;
                updateMicUI(true);
                statusElem.textContent = "🗣️ Listening! Speak letters clearly in English (e.g., 'A', 'B', 'C')";
                statusElem.className = "h-auto min-h-[24px] text-sm sm:text-base font-bold text-emerald-600 animate-pulse text-center px-4";
            };

            rec.onresult = function(event) {
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    const res = event.results[i];
                    if (!res.isFinal) continue; // ignore interim -> avoids duplicated letters
                    const alts = [];
                    for (let j = 0; j < res.length; j++) alts.push(res[j].transcript.toLowerCase().trim());
                    processSpokenAlternatives(alts);
                }
            };

            rec.onerror = function(event) {
                console.warn("Speech recognition event error:", event.error);
                if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                    statusElem.textContent = "⚠️ Mic permission denied. Please allow microphone access in browser settings.";
                    statusElem.className = "h-auto min-h-[24px] text-sm sm:text-base font-bold text-rose-600 text-center px-4";
                    stopVoiceRecognition();
                } else if (event.error === 'language-not-supported' && 'processLocally' in rec) {
                    // On-device pack not installed: fall back to online recognition
                    rec.processLocally = false;
                    statusElem.textContent = "🌐 Using online recognition.";
                } else if (event.error === 'no-speech') {
                    statusElem.textContent = "🗣️ Still listening... Say a letter!";
                }
            };

            rec.onend = function() {
                if (isListening) {
                    try { 
                        rec.start(); 
                    } catch(e) {
                        isListening = false;
                        updateMicUI(false);
                    }
                } else {
                    updateMicUI(false);
                }
            };

            return rec;
        }

        function toggleVoiceRecognition() {
            initAudioEngine();
            
            if (!recognition) {
                recognition = initSpeechRecognition();
            }
            if (!recognition) return;

            if (isListening) {
                stopVoiceRecognition();
            } else {
                try {
                    recognition.start();
                } catch(e) {
                    console.log("Mic restart fallback:", e);
                    // Force re-init if instance got stale
                    recognition = initSpeechRecognition();
                    if (recognition) {
                        try { recognition.start(); } catch(err) {}
                    }
                }
            }
        }

        function stopVoiceRecognition() {
            isListening = false;
            if (recognition) {
                try { recognition.stop(); } catch(e) {}
            }
            updateMicUI(false);
            const statusElem = document.getElementById('voice-status');
            statusElem.textContent = "Tap microphone to spell by voice!";
            statusElem.className = "h-auto min-h-[24px] text-sm sm:text-base font-bold text-teal-700 text-center px-4";
        }

        function updateMicUI(listening) {
            const btn = document.getElementById('mic-btn');
            const icon = document.getElementById('mic-icon');
            const text = document.getElementById('mic-text');

            if (listening) {
                btn.className = "bubble-btn bg-rose-500 hover:bg-rose-600 text-white font-black px-6 py-3 sm:px-8 sm:py-4 rounded-3xl shadow-xl flex items-center gap-3 text-lg sm:text-2xl border-b-4 border-rose-700 transition animate-pulse";
                icon.textContent = "🎙️🔴";
                text.textContent = "LISTENING... SAY LETTERS!";
            } else {
                btn.className = "bubble-btn bg-emerald-500 hover:bg-emerald-600 text-white font-black px-6 py-3 sm:px-8 sm:py-4 rounded-3xl shadow-xl flex items-center gap-3 text-lg sm:text-2xl border-b-4 border-emerald-700 transition";
                icon.textContent = "🎙️";
                text.textContent = "TAP TO SPELL BY VOICE";
            }
        }

        function toLetter(token) {
            const clean = token.replace(/[^a-z]/g, '');
            if (!clean) return null;
            return SPOKEN_LETTER_MAP[clean] || (clean.length === 1 ? clean.toUpperCase() : null);
        }

        // Look through all alternatives; for a single utterance prefer the letter the child needs next
        function processSpokenAlternatives(alts) {
            const item = activeWordList[currentIndex];
            const expected = item && userInputs.length < item.word.length ? item.word[userInputs.length].toUpperCase() : null;
            const single = alts.map(a => a.split(/\s+/).filter(Boolean)).filter(t => t.length === 1).map(t => toLetter(t[0]));
            if (single.length && expected && single.includes(expected)) {
                document.getElementById('voice-status').textContent = `Heard letter: "${expected}"!`;
                handleInputLetter(expected);
                return;
            }
            processSpokenText(alts[0]);
        }

        function processSpokenText(phrase) {
            const tokens = phrase.split(/\s+/);
            
            tokens.forEach(token => {
                const cleanToken = token.replace(/[^a-z]/g, '');
                if (!cleanToken) return;

                let matchedLetter = SPOKEN_LETTER_MAP[cleanToken];
                if (!matchedLetter && cleanToken.length === 1) {
                    matchedLetter = cleanToken.toUpperCase();
                }

                if (matchedLetter) {
                    const statusElem = document.getElementById('voice-status');
                    statusElem.textContent = `Heard letter: "${matchedLetter}"!`;
                    handleInputLetter(matchedLetter);
                }
            });
        }

        /* ----------------------------------------------------
           5. GAME MECHANICS & DOM RENDERING (UPGRADED)
           ---------------------------------------------------- */
        function loadWord() {
            const currentItem = activeWordList[currentIndex];
            if (!currentItem) return;

            userInputs = [];
            saveProgress();

            // Update UI Top Headers
            document.getElementById('word-emoji').textContent = currentItem.emoji;
            document.getElementById('word-id-num').textContent = currentItem.id;
            document.getElementById('school-word-display').textContent = currentItem.word.toUpperCase();
            document.getElementById('progress-tag').textContent = `Word ${currentIndex + 1} / ${activeWordList.length}`;

            // Render slots & key pad
            renderSlots();
            renderKeyboard();

            // Pronounce word when flashcard opens
            setTimeout(() => {
                speakCurrentWord();
            }, 300);
        }

        function renderSlots() {
            const currentItem = activeWordList[currentIndex];
            const targetWord = currentItem.word.toUpperCase();
            const container = document.getElementById('slots-container');
            container.innerHTML = '';

            for (let i = 0; i < targetWord.length; i++) {
                const slot = document.createElement('div');
                const isFilled = i < userInputs.length;
                const letter = isFilled ? userInputs[i] : '';

                // If hint mode is ON, show ghost/dashed letter outline
                const ghostChar = hintModeActive && !isFilled ? targetWord[i] : '';

                slot.className = `w-12 h-14 sm:w-16 sm:h-20 rounded-2xl border-4 flex items-center justify-center text-2xl sm:text-4xl font-black shadow-sm transition-all ${
                    isFilled 
                    ? 'bg-amber-300 border-amber-500 text-amber-950 pop-in scale-105' 
                    : hintModeActive
                    ? 'bg-white/50 border-dashed border-amber-300 text-amber-300/60'
                    : 'bg-white/80 border-dashed border-gray-300 text-transparent'
                }`;
                
                slot.textContent = letter || ghostChar || '_';

                if (isFilled && i === userInputs.length - 1) {
                    slot.onclick = () => removeLastLetter();
                }

                container.appendChild(slot);
            }
        }

        function renderKeyboard() {
            const currentItem = activeWordList[currentIndex];
            const targetLetters = currentItem.word.toUpperCase().split('');
            const container = document.getElementById('keyboard-container');
            container.innerHTML = '';

            // Generate distractors + target letters
            let letterPool = [...targetLetters];
            const extraCount = Math.max(3, 8 - letterPool.length);
            const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

            for (let i = 0; i < extraCount; i++) {
                const randomChar = alphabet[Math.floor(Math.random() * alphabet.length)];
                letterPool.push(randomChar);
            }

            // Shuffle keys
            letterPool.sort(() => Math.random() - 0.5);

            const colors = [
                'bg-rose-400 border-rose-600 text-white',
                'bg-purple-400 border-purple-600 text-white',
                'bg-sky-400 border-sky-600 text-white',
                'bg-emerald-400 border-emerald-600 text-white',
                'bg-amber-400 border-amber-600 text-amber-950',
                'bg-orange-400 border-orange-600 text-white'
            ];

            letterPool.forEach((char, idx) => {
                const btn = document.createElement('button');
                const colorClass = colors[idx % colors.length];

                btn.className = `bubble-btn ${colorClass} w-12 h-12 sm:w-16 sm:h-16 rounded-2xl text-2xl sm:text-3xl font-black border-b-4 flex items-center justify-center active:scale-95 transition`;
                btn.textContent = char;
                btn.onclick = () => handleInputLetter(char);

                container.appendChild(btn);
            });
        }

        function handleInputLetter(char) {
            const currentItem = activeWordList[currentIndex];
            const targetWord = currentItem.word.toUpperCase();

            if (userInputs.length < targetWord.length) {
                playSound('pop');
                speakLetter(char); // Pronounce letter A, B, C...
                userInputs.push(char);
                renderSlots();

                if (userInputs.length === targetWord.length) {
                    checkAnswer();
                }
            }
        }

        function removeLastLetter() {
            if (userInputs.length > 0) {
                playSound('pop');
                userInputs.pop();
                renderSlots();
            }
        }

        function clearInputs() {
            playSound('pop');
            userInputs = [];
            renderSlots();
        }

        function toggleHintMode() {
            playSound('pop');
            hintModeActive = !hintModeActive;
            const label = document.getElementById('hint-btn-label');
            label.textContent = hintModeActive ? 'Guide: ON' : 'Guide: OFF';
            saveProgress();
            renderSlots();
        }

        function checkAnswer() {
            const currentItem = activeWordList[currentIndex];
            const targetWord = currentItem.word.toUpperCase();
            const enteredWord = userInputs.join('');

            if (enteredWord === targetWord) {
                // Stop listening temporarily on win
                stopVoiceRecognition();

                score += 10;
                completed.add(currentItem.id);
                saveProgress();
                document.getElementById('star-count').textContent = score;

                triggerCanvasConfetti();

                setTimeout(() => {
                    speakText(`Great spelling! ${currentItem.word}!`, 0.9);
                    document.getElementById('win-word-name').textContent = currentItem.word;
                    document.getElementById('win-modal').classList.remove('hidden');
                }, 400);

            } else {
                // Gentle Error feedback
                playSound('error');
                const slots = document.getElementById('slots-container');
                slots.classList.add('shake');
                speakText("Try again!", 0.9);

                setTimeout(() => {
                    slots.classList.remove('shake');
                    clearInputs();
                }, 650);
            }
        }

        function continueAfterWin() {
            document.getElementById('win-modal').classList.add('hidden');
            nextWord();
        }

        function nextWord() {
            if (currentIndex < activeWordList.length - 1) {
                currentIndex++;
            } else {
                currentIndex = 0;
            }
            loadWord();
        }

        function prevWord() {
            if (currentIndex > 0) {
                currentIndex--;
            } else {
                currentIndex = activeWordList.length - 1;
            }
            loadWord();
        }

        /* ----------------------------------------------------
           6. WORD LIST GRID & SEARCH / FILTERS
           ---------------------------------------------------- */
        function showWordGrid() {
            playSound('pop');
            renderWordGrid();
            document.getElementById('grid-modal').classList.remove('hidden');
            document.getElementById('grid-modal').classList.add('flex');
        }

        function hideWordGrid() {
            playSound('pop');
            document.getElementById('grid-modal').classList.add('hidden');
            document.getElementById('grid-modal').classList.remove('flex');
        }

        function renderWordGrid() {
            const container = document.getElementById('word-list-grid');
            container.innerHTML = '';

            activeWordList.forEach((item, idx) => {
                const card = document.createElement('div');
                const isCurrent = idx === currentIndex;

                card.className = `p-3 rounded-2xl flex flex-col items-center justify-center cursor-pointer border-2 transition ${
                    isCurrent ? 'bg-amber-100 border-amber-500 scale-105 shadow-md' : 'bg-gray-50 border-gray-200 hover:bg-amber-50'
                }`;
                card.innerHTML = `
                    <span class="text-3xl">${item.emoji}</span>
                    <span class="font-black text-lg text-gray-800 uppercase mt-1">${item.word}</span>
                    <span class="text-xs text-teal-600 font-bold">#${item.id} ${completed.has(item.id) ? '✅' : ''}</span>
                `;
                card.onclick = () => {
                    currentIndex = idx;
                    hideWordGrid();
                    loadWord();
                };

                container.appendChild(card);
            });
        }

        function applyFilter(category) {
            currentFilter = category;
            if (category === 'easy') activeWordList = WORDS_DATA.filter(w => w.word.length <= 3);
            else if (category === 'medium') activeWordList = WORDS_DATA.filter(w => w.word.length === 4);
            else if (category === 'hard') activeWordList = WORDS_DATA.filter(w => w.word.length >= 5);
            else { currentFilter = 'all'; activeWordList = [...WORDS_DATA]; }
        }

        function setFilter(category) {
            playSound('pop');
            applyFilter(category);
            currentIndex = 0;
            renderWordGrid();
            loadWord();
        }

        /* ----------------------------------------------------
           7. PURE HTML5 CANVAS CONFETTI (No external libraries)
           ---------------------------------------------------- */
        function triggerCanvasConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const particleCount = 70;
            const colors = ['#FF6B6B', '#4ECDC4', '#FFE66D', '#A29BFE', '#74B9FF'];

            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 14,
                    vy: (Math.random() - 0.8) * 14,
                    size: Math.random() * 10 + 6,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * 360,
                    rSpeed: (Math.random() - 0.5) * 10
                });
            }

            let animationFrame;
            const startTime = Date.now();

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let alive = false;

                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.3; // Gravity
                    p.rotation += p.rSpeed;

                    if (p.y < canvas.height) alive = true;

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.rotation * Math.PI) / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                    ctx.restore();
                });

                if (alive && Date.now() - startTime < 2500) {
                    animationFrame = requestAnimationFrame(animate);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    cancelAnimationFrame(animationFrame);
                }
            }

            animate();
        }

        /* ----------------------------------------------------
           8. PWA INSTALLATION & SERVICE WORKER SETUP
           ---------------------------------------------------- */
        function initPWA() {
            const manifestData = {
                name: "Kinder Spelling Bee Flashcards",
                short_name: "SpellingBee",
                start_url: ".",
                display: "standalone",
                background_color: "#E0F7FA",
                theme_color: "#4ECDC4",
                icons: [
                    {
                        src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐝</text></svg>",
                        sizes: "192x192 512x512",
                        type: "image/svg+xml"
                    }
                ]
            };
            const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
            document.getElementById('manifest-placeholder').setAttribute('href', URL.createObjectURL(manifestBlob));

            if ('serviceWorker' in navigator) {
                const swCode = `
                    const CACHE_NAME = 'kinder-bee-v2';
                    self.addEventListener('install', (e) => {
                        e.waitUntil(
                            caches.open(CACHE_NAME).then((cache) => cache.addAll(['./']))
                        );
                    });
                    self.addEventListener('fetch', (e) => {
                        e.respondWith(
                            caches.match(e.request).then((res) => res || fetch(e.request))
                        );
                    });
                `;
                const swBlob = new Blob([swCode], { type: 'application/javascript' });
                navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
            }
        }

        window.onload = function() {
            initPWA();
            restoreProgress();
            loadWord();
        };
    </script>
