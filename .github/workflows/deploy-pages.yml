name: Deploy Princess ABC to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['princess-abc/**', 'kinder-bee/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: princess-abc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: princess-abc/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: mkdir -p dist/kinder-bee && cp ../kinder-bee/index.html dist/kinder-bee/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: princess-abc/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
